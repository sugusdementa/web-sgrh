    <!-- 2. CONTENIDO PRINCIPAL DE EMPLEADOS -->
    <main>
        <h1>Empleados: Alta/Edición</h1>
        <br />
        <form id="form-empleado" method="post" action="">
            <div class="form-columns-container">

                <!-- PRIMERA COLUMNA (7 campos) -->
                <div class="form-column">
                    <div class="form-group">
                        <label for="legajo">Legajo:</label>
                        <input type="text" id="legajo" name="legajo" required>
                    </div>
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="dni">DNI:</label>
                        <input type="number" id="dni" name="dni" required>
                    </div>
                    <div class="form-group">
                        <label for="fecha-nacimiento">Fecha de Nacimiento:</label>
                        <input type="date" id="fecha-nacimiento" name="fecha_nacimiento">
                    </div>
                    <div class="form-group">
                        <label for="fecha-ingreso">Fecha de Ingreso:</label>
                        <input type="date" id="fecha-ingreso" name="fecha_ingreso" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono">
                    </div>
                </div>

                <!-- SEGUNDA COLUMNA (5 campos) -->
                <div class="form-column">
                    <div class="form-group">
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" required>
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoría:</label>
                        <select id="categoria" name="categoria" required>
                            <option value="" disabled selected hidden>Seleccione una opción...</option>
                            <option value="senior">Senior</option>
                            <option value="semisenior">SemiSenior</option>
                            <option value="junior">Junior</option>
                            <option value="trainee">Trainee/Pasante</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="sbase">Salario Base:</label>
                        <input type="number" id="sbase" name="sbase" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="sector">Sector:</label>
                        <select id="sector" name="sector" required>
                            <option value="" disabled selected hidden>Seleccione una opción...</option>
                            <option value="administracion">Administración</option>
                            <option value="ventas">Ventas</option>
                            <option value="sistemas">Sistemas</option>
                            <option value="rrhh">Recursos Humanos</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado:</label>
                        <select id="estado" name="estado" required>
                            <option value="" disabled selected hidden>Seleccione una opción...</option>
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                    </div>
                </div>

            </div>

            <!-- Contenedor de Botones -->
            <div class="form-actions">
                <button type="submit" id="btn-guardar" name="btn_guardar" style="background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
                    <i id="btn-icono" class="fas fa-save"></i> <span id="btn-texto">Guardar</span>
                </button>
                <button type="reset" id="btn-limpiar" name="btn_limpiar" style="background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Limpiar</button>
                <button type="button" id="btn-cancelar" name="btn_cancelar" style="background-color: #6c757d; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Cancelar</button>
                <!-- llamado al script -->
                <script src="Script1.js"></script>
