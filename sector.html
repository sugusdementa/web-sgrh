    <!-- 2. CONTENIDO PRINCIPAL DE SECTORES -->
    <main>
        <h1>Sectores: Alta / Edición</h1>

        <form id="form-sectores" method="post" action="">
            <div class="form-grid">
                <div class="form-group">
                    <label for="codigo">Código:</label>
                    <input type="text" id="codigo" name="codigo" required />
                </div>
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required />
                </div>
                <div class="form-group">
                    <label for="responsable">Responsable:</label>
                    <input type="text" id="responsable" name="responsable" required />
                </div>
                <div class="form-group">
                    <label for="presup_anual">Presupuesto Anual:</label>
                    <input type="text" id="presup_anual" name="presup_anual" />
                </div>
                <div class="form-group">
                    <label for="alta">Alta:</label>
                    <input type="date" id="alta" name="alta" required />
                </div>
                <div class="form-group">
                    <label for="baja">Baja:</label>
                    <input type="date" id="baja" name="baja" required />
                </div>
                <div class="form-group">
                    <label for="motiv">Motivo:</label>
                    <input type="text" id="motiv" name="motiv" />
                </div>
            </div>
            <!-- Tabla de Resultados de Consulta -->
            <div id="contenedor-resultados" class="table-container" style="display: none; width: 100%; max-width: 850px; margin-top: 25px;">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Responsable</th>
                            <th>Presup. Anual</th>
                            <th>Operaciones</th>
                            <th>Alta</th>
                            <th>Baja</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-resultados-body">
                        <!-- Aquí JavaScript insertará las filas encontradas -->
                    </tbody>
                </table>
            </div>
            <!-- Contenedor de 4 Botones ABMC -->
            <div class="form-actions">
                <button type="button" id="btn-alta" class="btn-accion btn-alta">
                    <i class="fas fa-plus-circle"></i> Alta
                </button>
                <button type="button" id="btn-baja" class="btn-accion btn-baja">
                    <i class="fas fa-trash-alt"></i> Baja
                </button>
                <button type="button" id="btn-modificar" class="btn-accion btn-modificar">
                    <i class="fas fa-edit"></i> Modificar
                </button>
                <button type="button" id="btn-consultar" class="btn-accion btn-consultar">
                    <i class="fas fa-search"></i> Consultar
                </button>
            </div>
        </form>
    </main>
