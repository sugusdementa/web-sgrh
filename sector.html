<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Sistema de Gestion de Recursos Humanos</title>
    <!-- 1. Enlace a hoja de estilos -->
    <link rel="stylesheet" href="estilos.css" />
</head>
<body>
 
        <!--form de sectores campos-->
        <form method="post" action="">
            <h1>Sectores</h1>
            <span>
                <div class="form-grid">

                    <div class="form-group"
                    <label for="codigo">Codigo:</label>
                    <input type="text" id="codigo" name="codigo"/>
                </div>
                    <div class="form-group"
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre"/>
                </div>
                    <div class="form-group"
                    <label for="responsable">Responsable:</label>
                    <input type="text" id="responsable" name="responsable"/>
                </div>
                    <div class="form-group"
                    <label for="presup_anual">Presupuesto Anual:</label>
                    <input type="text" id="presup_anual" name="presup_anual"/>
                </div>
                    <div class="form-group"
                    <label for="oper_req">Operaciones Requeridas:</label>
                    <input type="text" id="oper_req" name="oper_req"/>
                </div>
                    <div class="form-group"
                    <label for="alta">Alta:</label>
                    <input type="text" id="alta" name="alta"/>
                </div>
                    <div class="form-group"
                    <label for="baja">Baja:</label>
                    <input type="text" id="baja" name="baja"/>
                </div>
                    <div class="form-group"
                    <label for="mod">Modificacion:</label>
                    <input type="text" id="mod" name="mod"/>
                </div>
                    <div class="form-group"
                    <label for="cons">Consulta:</label>
                    <input type="text" id="cons" name="cons"/>
                </div>
                </div>
            </span>
        </form>
    </body>
</html>
